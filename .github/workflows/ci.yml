name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      core_ref:
        description: "Public Core tag or commit used to test and build the registry"
        type: string
        default: main
      publish_registry:
        description: "Publish verified packages and update the stable R2 registry (main only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bishu-novel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/DeterminFlow
          ref: ${{ inputs.core_ref || 'main' }}
          path: determinflow
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            determinflow/requirements-dev.lock
      - run: python -m pip install -r determinflow/requirements-dev.lock
      - name: Test Plugin
        env:
          PYTHONPATH: ${{ github.workspace }}/determinflow:${{ github.workspace }}/plugins/bishu-novel
        run: python -m pytest -q plugins/bishu-novel/tests
      - name: Validate Workflows
        run: >-
          python determinflow/src/core/defaults/skills/workflow-guide/scripts/validate_definition.py
          plugins/bishu-novel/resources/workflows

  public-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/DeterminFlow
          ref: ${{ inputs.core_ref || 'main' }}
          path: determinflow
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            determinflow/requirements-dev.lock
            plugins/public-api/requirements.txt
      - run: >-
          python -m pip install
          -r determinflow/requirements-dev.lock
          -r plugins/public-api/requirements.txt
      - name: Test Plugin
        env:
          DETERMINFLOW_CORE_ROOT: ${{ github.workspace }}/determinflow
          PYTHONPATH: ${{ github.workspace }}/determinflow:${{ github.workspace }}/plugins/public-api
        run: python -m pytest -q plugins/public-api/tests

  publish-registry:
    if: >-
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_registry)) &&
      github.ref == 'refs/heads/main' &&
      vars.R2_DISTRIBUTION_ENABLED == 'true'
    needs:
      - bishu-novel
      - public-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/DeterminFlow
          ref: ${{ inputs.core_ref || 'main' }}
          path: determinflow
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: determinflow/requirements.lock
      - run: python -m pip install -r determinflow/requirements.lock
      - name: Build signed registry
        working-directory: determinflow
        env:
          PLUGIN_REGISTRY_SIGNING_KEY: ${{ secrets.PLUGIN_REGISTRY_SIGNING_KEY }}
        run: >-
          python -m src.plugin_system.registry_release build
          --repository "$GITHUB_WORKSPACE"
          --source-url "https://github.com/alikon-art/DeterminFlow-Plugins.git"
          --ref "$GITHUB_SHA"
          --output "$GITHUB_WORKSPACE/registry-output"
          --public-base-url "https://downloads.determinflow.com/plugins/v1"
      - name: Publish verified registry to R2
        working-directory: determinflow
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
        run: |
          aws --version
          python -m src.plugin_system.registry_release publish \
            --registry-dir "$GITHUB_WORKSPACE/registry-output" \
            --prefix "plugins/v1" \
            --bucket "$R2_BUCKET" \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --public-base-url "https://downloads.determinflow.com"
