[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "determinflow-plugin-public-api"
version = "0.1.36"
description = "Optional public model credential plugin for DeterminFlow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["determinflow_plugin_public_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
