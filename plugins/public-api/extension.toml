[extension]
id = "public-api"
name = "笔枢公益模型"
version = "0.1.37"
api_version = "1"
description = "由笔枢写作免费提供的模型体验服务。"
backend = "determinflow_plugin_public_api.backend.extension:create_extension"
dependencies = []
capabilities = ["api.routes", "model.providers"]

[resource_namespace]
prefix = "public-api"

[installation]
requirements = "requirements.txt"

[page]
label = "公益模型"
static_dir = "ui"
entrypoint = "index.html"
show_in_details = false

[header_status]
endpoint = "/api/public-api/status"
refresh_endpoint = "/api/public-api/renew"
