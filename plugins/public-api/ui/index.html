<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>公益模型</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="page-header">
        <div>
          <h1 id="page-title">公益模型</h1>
          <p id="summary" class="summary" aria-live="polite">正在读取状态…</p>
        </div>
        <span id="state" class="state" data-state="loading">加载中</span>
      </header>

      <section id="announcement-feed" class="announcement-feed" aria-labelledby="announcement-title" aria-live="polite" hidden>
        <h2 id="announcement-title">公益模型公告</h2>
        <div id="announcement-list" class="announcement-list"></div>
      </section>

      <p id="disclosure" class="disclosure">
        <a id="official-link" href="https://bishuxiezuo.cn/" target="_blank" rel="noopener noreferrer">笔枢写作</a><span id="service-notice">公益模型服务正在载入。</span>
      </p>

      <section class="card" aria-labelledby="quota-title">
        <div class="card-heading">
          <div>
            <h2 id="quota-title">当前额度</h2>
            <p id="tier" class="quota-kind">—</p>
          </div>
          <div class="actions">
            <button id="renew" class="button button-secondary" type="button">重试</button>
            <button id="payment" class="button button-accent" type="button" hidden>充值</button>
          </div>
        </div>
        <p id="error" class="error" role="alert" hidden></p>
        <dl class="details">
          <div><dt>今日免费额度</dt><dd id="daily-benefit">—</dd></div>
          <div id="wallet-row" hidden><dt>充值余额</dt><dd id="wallet">—</dd></div>
          <div><dt>本周免费额度</dt><dd id="weekly-benefit">—</dd></div>
          <div><dt>有效期</dt><dd id="expiry">—</dd></div>
          <div><dt>可用模型</dt><dd id="model-count">—</dd></div>
        </dl>
      </section>

      <section class="catalog" aria-labelledby="catalog-title">
        <div class="catalog-heading">
          <h2 id="catalog-title">模型列表</h2>
          <p id="catalog-note">正在读取完整目录…</p>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">模型</th>
                <th class="price-heading" scope="col">输入</th>
                <th class="price-heading" scope="col">缓存命中</th>
                <th class="price-heading" scope="col">输出</th>
              </tr>
            </thead>
            <tbody id="catalog-body">
              <tr><td colspan="4" class="empty">正在读取完整模型目录…</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
